<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#08111f">
  <title>PingPong Manager · Mantenimiento</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 20% 20%,rgba(37,99,235,.22),transparent 34%),
      radial-gradient(circle at 85% 80%,rgba(14,165,233,.14),transparent 30%),#08111f;color:#e5eefb}
    main{width:min(620px,100%);padding:40px;border:1px solid rgba(148,163,184,.2);border-radius:24px;
      background:rgba(15,23,42,.82);box-shadow:0 28px 80px rgba(0,0,0,.35);text-align:center}
    .ball{width:70px;height:70px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;
      background:#fff;color:#2563eb;font-size:34px;box-shadow:0 0 0 10px rgba(37,99,235,.12)}
    h1{margin:0 0 12px;font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.1}
    p{margin:0 auto;color:#b9c8dc;font-size:1.05rem;line-height:1.65;max-width:480px}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:26px;padding:10px 14px;border-radius:999px;
      background:rgba(245,158,11,.12);color:#fbbf24;font-weight:700}
    .dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 12px #f59e0b}
    small{display:block;margin-top:24px;color:#71839b}
  </style>
</head>
<body>
  <main>
    <div class="ball" aria-hidden="true">🏓</div>
    <h1>PingPong Manager está en mantenimiento</h1>
    <p>Estamos preparando una versión más segura y estable. La aplicación volverá a estar disponible cuando terminen las pruebas.</p>
    <div class="status"><span class="dot"></span> Versión pública temporalmente pausada</div>
    <small>Los torneos guardados en tu dispositivo no se eliminan.</small>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (items) {
        items.forEach(function (registration) { registration.unregister(); });
      });
    }
    if ("caches" in window) {
      caches.keys().then(function (keys) {
        keys.forEach(function (key) { caches.delete(key); });
      });
    }
  </script>
</body>
</html>
